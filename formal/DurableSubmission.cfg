\* Safety instance: 2 Submissions on one Conversation lane, 2 workers,
\* fault budget 2 (crashes at every durable boundary + premature lease expiry).
\* Liveness (EventuallySettled) is checked on DurableSubmissionLiveness.cfg,
\* whose smaller worker pool keeps the temporal check tractable.
\* Run: java -XX:+UseParallelGC -cp tla2tools.jar tlc2.TLC -deadlock -config DurableSubmission.cfg DurableSubmission.tla
SPECIFICATION Spec
CONSTANTS
  Subs = {1, 2}
  Workers = {w1, w2}
  MaxFaults = 2
  FencingEnabled = TRUE
INVARIANTS
  TypeOK
  ExactlyOneSettlement
  FIFOPerLane
  NoLostAcceptedWork
  UnknownBlocksContinuation
  FencingSafety
  JoinConservation
  NoFabricatedToolResult
