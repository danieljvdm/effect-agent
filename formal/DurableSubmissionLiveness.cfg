\* Liveness instance: EventuallySettled under weak fairness of worker, recovery,
\* and resolver actions plus the bounded fault budget (the durability SS1
\* conditional-liveness assumptions).  One worker keeps the temporal check
\* tractable; stale-Attempt interleavings still occur through lease expiry and
\* recovery claims.  Safety over the larger 2-worker instance is
\* DurableSubmission.cfg.
SPECIFICATION Spec
CONSTANTS
  Subs = {1, 2}
  Workers = {w1}
  MaxFaults = 2
  FencingEnabled = TRUE
INVARIANTS
  TypeOK
  ExactlyOneSettlement
  FIFOPerLane
  NoLostAcceptedWork
  UnknownBlocksContinuation
  FencingSafety
  JoinConservation
  NoFabricatedToolResult
PROPERTIES
  EventuallySettled
