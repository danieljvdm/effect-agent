\* Plan SS7(a) fix discipline (AwaitParentEstablishment = TRUE): a
\* parent-linked admitted child whose Thread lacks the canonical
\* SubagentLineageRecorded record DEFERS its own materialization/readiness
\* repair; the parent's idempotent establishment completes it.  The
\* child-runs-before-lineage interleaving is eliminated while every protocol
\* invariant and both liveness properties still hold.  WP7 implements this
\* as the AwaitParentEstablishment classifier decision after this model check.
SPECIFICATION Spec
CONSTANTS
  MaxFaults = 2
  MaxRouteFaults = 2
  AwaitParentEstablishment = TRUE
INVARIANTS
  TypeOK
  OneChildPerToolCall
  JoinRequiresChildSettlement
  ReservationConservation
  AbortJoinsBeforeParentSettles
  EstablishmentOrder
  ChildTurnRequiresLineage
PROPERTIES
  ParentEventuallySettles
  ChildEventuallySettles
