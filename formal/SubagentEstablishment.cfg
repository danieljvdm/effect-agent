\* Main instance under the CURRENT child-recovery discipline
\* (AwaitParentEstablishment = FALSE): the four S2 protocol invariants and
\* both liveness properties hold.  The child-runs-before-lineage ordering
\* hygiene is deliberately NOT checked here -- see
\* SubagentEstablishmentRace.cfg (expected violation, current discipline)
\* and SubagentEstablishmentFix.cfg (expected pass, plan SS7(a) discipline).
SPECIFICATION Spec
CONSTANTS
  MaxFaults = 2
  MaxRouteFaults = 2
  AwaitParentEstablishment = FALSE
INVARIANTS
  TypeOK
  OneChildPerToolCall
  JoinRequiresChildSettlement
  ReservationConservation
  AbortJoinsBeforeParentSettles
  EstablishmentOrder
PROPERTIES
  ParentEventuallySettles
  ChildEventuallySettles
