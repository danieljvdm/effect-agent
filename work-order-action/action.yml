name: "Effect Agent PR Work Order"
description: >-
  Admit, implement, check, atomically publish, and present one explicitly
  dispatched inline pull-request work order. Use the documented multi-job
  workflow so model, checks, contents publication, and thread presentation
  receive disjoint credentials.
branding:
  icon: "git-commit"
  color: "purple"
inputs:
  phase:
    description: "Internal workflow phase: admit, implement, checks, publish, or present."
    required: true
  artifact-directory:
    description: "Directory containing the immutable cross-job work-order artifacts."
    required: false
    default: ".effect-agent-work-order"
  github-token:
    description: "Phase-scoped GitHub token. Never pass this in the implement or checks phase."
    required: false
  state-secret:
    description: "Stable HMAC secret for the durable admission/result journal reply."
    required: false
  state-author-id:
    description: "Stable numeric GitHub actor id that authors authenticated journal replies."
    required: false
  authorized-actor-ids:
    description: "Comma-separated stable numeric GitHub user ids authorized to dispatch."
    required: false
  provider:
    description: 'Model provider: "openai" or "anthropic".'
    required: false
    default: "openai"
  model:
    description: "Model id (defaults: openai gpt-5.6-sol, anthropic claude-sonnet-5)."
    required: false
  openai-api-key:
    description: "OpenAI API key, implement phase only."
    required: false
  anthropic-api-key:
    description: "Anthropic API key, implement phase only."
    required: false
  repository-path:
    description: "Exact-head checkout used only by implement or checks."
    required: false
    default: "worktree"
  support-paths:
    description: "JSON array of normalized support paths fixed before model execution."
    required: false
    default: "[]"
  checks:
    description: >-
      JSON array of trusted named check specs: name, command, args, and
      timeoutSeconds. At least one is required for implementation.
    required: false
    default: "[]"
  check-container-image:
    description: >-
      Immutable container image digest used for network-disabled required
      checks. Required only by the checks phase.
    required: false
  max-duration-minutes:
    description: "Bounded model duration. Keep the implement job timeout above this value."
    required: false
    default: "8"
  commit-message:
    description: "Host-authored commit headline."
    required: false
  publication-attempted:
    description: >-
      Presenter-only workflow signal. true when validated check evidence made
      the publisher job eligible, so a missing terminal is publication uncertainty.
    required: false
    default: "false"
outputs:
  should-run:
    description: "true only for the first durably admitted delivery."
  duplicate:
    description: "true when an authenticated journal already owns this dispatch."
  stored-outcome:
    description: "Stored terminal outcome, claimed, or incomplete."
  work-order-id:
    description: "Immutable admitted work-order identity."
  candidate:
    description: "true when the implementer produced a host-validated candidate patch."
  validated:
    description: "true when isolated required checks passed without mutating the patch."
  published:
    description: "true when GitHub atomically committed the patch at the expected head."
  outcome:
    description: "published, settled, or failed after the durable reply is updated."
runs:
  using: node24
  main: dist/index.mjs
