name: "Effect Agent PR Review"
description: >-
  Review the current pull request with @effect-agent/pr-review — a bounded,
  read-only reviewer whose findings are validated against the real diff — and
  post the result as a pull-request review. Ephemeral execution (deployment
  class E): a runtime failure posts nothing, an incomplete settled review
  fails the check honestly, and posting is never exactly-once.
branding:
  icon: "eye"
  color: "purple"
inputs:
  openai-api-key:
    description: "OpenAI API key (required when provider is openai, the default)."
    required: false
  anthropic-api-key:
    description: "Anthropic API key (required when provider is anthropic)."
    required: false
  github-token:
    description: "Token with pull-requests: write on this repository."
    required: false
    default: ${{ github.token }}
  provider:
    description: 'Model provider: "openai" (default) or "anthropic".'
    required: false
    default: "openai"
  model:
    description: "Model id (defaults: openai gpt-5.6-sol, anthropic claude-sonnet-5)."
    required: false
  effort:
    description: >-
      Reasoning effort: "low", "medium", "high", "xhigh", "max", or a number
      in [0, 1]. Stored as a position and resolved onto the provider's own
      effort ladder, so the same value survives a provider or model change.
      Unset uses the provider default.
    required: false
  max-duration-minutes:
    description: >-
      Run duration budget in minutes (defaults: 8 flat, 15 fan-out). Keep the
      job's timeout-minutes ABOVE this so the reviewer ends its run gracefully
      instead of being killed by the runner with nothing posted.
    required: false
  post:
    description: "Post the review ('true', default) or only print the plan ('false')."
    required: false
    default: "true"
  apply-verdict:
    description: "Map the model verdict onto APPROVE/REQUEST_CHANGES instead of always COMMENT."
    required: false
    default: "false"
  fan-out:
    description: "Delegate per-unit file reviews to bounded subagent children."
    required: false
    default: "false"
  guidance:
    description: "Extra review guidance injected into the reviewer's instructions."
    required: false
  guidance-file:
    description: >-
      Path to a committed review-profile file whose content is injected into
      the reviewer's instructions (before any inline guidance). Requires
      actions/checkout; a configured-but-unreadable file fails the job.
    required: false
  ignore:
    description: 'Comma-separated glob patterns removed from the review surface, e.g. "**/*.lock,dist/**".'
    required: false
  max-findings:
    description: "Findings bound (1-20)."
    required: false
  fail-on:
    description: >-
      Deprecated compatibility input. Blocking findings and incomplete
      coverage always fail the check; model verdicts never weaken that gate.
    required: false
    default: "never"
  skip-unchanged:
    description: >-
      Skip model execution when the current head is already the last
      successfully reviewed head ('true', default), while preserving the
      stored blocking/success conclusion. Set 'false' to force execution.
    required: false
    default: "true"
  review-mode:
    description: >-
      "incremental" (default) reviews changes since the last compatible,
      successfully covered head. "final" deliberately audits the full
      current pull-request diff.
    required: false
    default: "incremental"
outputs:
  skipped:
    description: "'true' when the event is not reviewable or the head already has stored coverage."
  skip-reason:
    description: "Why the run skipped (set only when skipped is 'true')."
  fingerprint:
    description: "Deprecated changeset-fingerprint output."
  conclusion:
    description: "Host-derived check conclusion: success, blocking, or incomplete."
  coverage:
    description: "Host-derived required-scope coverage: complete or incomplete."
  review-mode:
    description: "Selected scope: incremental or full."
  review-reason:
    description: "Why incremental or full scope was selected."
  verdict:
    description: "The review verdict: approve, comment, or request-changes."
  inline-comments:
    description: "Number of inline comments in the validated plan."
  demoted-findings:
    description: "Number of findings whose anchors failed diff validation."
  concerns:
    description: "Number of non-anchored concerns rendered into the review body."
  input-tokens:
    description: "Input tokens the run budget observed (coordinator only under fan-out)."
  output-tokens:
    description: "Output tokens the run budget observed (coordinator only under fan-out)."
  review-url:
    description: "URL of the posted review (empty on dry runs)."
runs:
  using: node24
  main: dist/index.mjs
