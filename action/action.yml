name: "Effect Agent PR Review"
description: "Run one bounded parallel review wave and publish its validated findings to GitHub."
branding:
  icon: "eye"
  color: "purple"
inputs:
  openai-api-key:
    description: "OpenAI API key."
    required: true
  github-token:
    description: "Token with pull-requests: write on this repository."
    required: false
    default: ${{ github.token }}
  pull-request:
    description: "Pull request number."
    required: true
  review-author:
    description: "GitHub bot login used to recognize this channel's prior reviews."
    required: false
    default: "github-actions[bot]"
  mode:
    description: 'Scope policy: "auto", "incremental", or "full".'
    required: false
    default: "auto"
  automatic-review-limit:
    description: "Number of automatic review attempts allowed per pull request. Accepts any non-negative integer."
    required: false
    default: "2"
  expected-head:
    description: "Webhook head SHA; a stale event exits before model execution."
    required: false
  model:
    description: "OpenAI model id."
    required: false
    default: "gpt-5.6-sol"
  effort:
    description: 'Reasoning effort: "low", "medium", "high", or "xhigh".'
    required: false
    default: "medium"
  guidance-file:
    description: "Optional committed repository guidance file."
    required: false
  ignore:
    description: "Comma-separated exact paths, prefix/**, **/name, or **/*.suffix patterns."
    required: false
outputs:
  skipped:
    description: "Whether model execution and publication were skipped."
  reason:
    description: "Selection or skip reason."
  input-tokens:
    description: "Observed total model input tokens."
  uncached-input-tokens:
    description: "Observed input tokens not served from or written to the provider prompt cache."
  cached-input-tokens:
    description: "Observed input tokens served from the provider prompt cache."
  cache-write-input-tokens:
    description: "Observed input tokens written to the provider prompt cache."
  output-tokens:
    description: "Observed model output tokens."
  estimated-cost-usd:
    description: "Estimated model cost in US dollars when the configured model has known pricing."
  blocking-findings:
    description: "Number of published blocking findings."
  review-url:
    description: "URL of the published review."
runs:
  using: node24
  main: dist/index.mjs
