name: "Effect Agent PR Review"
description: "Review exact pull-request changes with repository context and publish one validated review."
branding:
  icon: "eye"
  color: "purple"
inputs:
  openai-api-key:
    description: "OpenAI API key."
    required: true
  github-token:
    description: "Token with pull-requests: write and, for manual commands, issues: write on this repository."
    required: false
    default: ${{ github.token }}
  pull-request:
    description: "Pull request number."
    required: true
  review-author:
    description: "GitHub bot login used to recognize this channel's prior reviews."
    required: false
    default: "github-actions[bot]"
  mode:
    description: 'Scope policy: "auto", "incremental", or "full". Auto falls back to the full diff after merge-base movement. Explicit incremental review stops and requires full to establish a new baseline.'
    required: false
    default: "auto"
  command:
    description: "Optional raw collaborator command. Accepts @effect-agent review or @effect-agent review full, with surrounding whitespace ignored."
    required: false
  comment-id:
    description: "Issue comment ID for a manual command. Required when command is set so the action can acknowledge it with an eyes reaction."
    required: false
    default: "0"
  automatic-review-limit:
    description: "Number of automatic review attempts allowed per pull request. Zero disables automatic reviews and notices."
    required: false
    default: "2"
  expected-head:
    description: "Webhook head SHA; a stale event exits before model execution."
    required: false
  model:
    description: "Required OpenAI model id: gpt-6-astra, gpt-5.6-sol, gpt-5.6, gpt-5.6-terra, or gpt-5.6-luna."
    required: true
  effort:
    description: 'Reasoning effort: "low", "medium", "high", "xhigh", or "max".'
    required: false
    default: "medium"
  max-cost-usd:
    description: "Maximum model spend per attempt in USD (0.01–100). Allowance is base-cost-usd plus $1 per 100,000 patch/feedback characters, capped at this value."
    required: false
    default: "2.50"
  base-cost-usd:
    description: "Base model spend allowance per nonempty attempt in USD (0.01–100), before adding $1 per 100,000 patch/feedback characters. The total never exceeds max-cost-usd."
    required: false
    default: "1.00"
  priority:
    description: 'Processing priority: omit to use the OpenAI project setting, "default" to force Standard, or "fast" for Fast mode within the same spending cap.'
    required: false
  guidance-file:
    description: "Optional committed repository guidance file."
    required: false
  ignore:
    description: "Comma-separated exact paths, prefix/**, **/name, or **/*.suffix patterns."
    required: false
outputs:
  skipped:
    description: "Whether model review execution was skipped. A closing pause review may still be published."
  reason:
    description: "Selection or skip reason."
  input-tokens:
    description: "Observed total model input tokens."
  uncached-input-tokens:
    description: "Observed input tokens not served from or written to the provider prompt cache."
  cached-input-tokens:
    description: "Observed input tokens served from the provider prompt cache."
  cache-write-input-tokens:
    description: "Observed input tokens written to the provider prompt cache."
  output-tokens:
    description: "Observed model output tokens."
  estimated-cost-usd:
    description: "Estimated model cost in US dollars from reported usage at the pinned rates for the actual service tier. Excludes unsettled reservations."
  reserved-cost-usd:
    description: "Maximum additional charge in US dollars for dispatched requests whose usage is still unknown."
  cost-limit-usd:
    description: "Size-scaled spending admission ceiling for this attempt in US dollars. Zero when no model review runs."
  blocking-findings:
    description: "Number of published blocking findings."
  unresolved-change-requests:
    description: "Trusted earlier change requests not explicitly verified as addressed or manually dismissed. These fail the action even when no new blocker is found."
  review-url:
    description: "URL of the published review."
runs:
  using: node24
  main: dist/index.mjs
