name: Runtime performance

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline commit, branch or tag (blank uses the latest published release)
        type: string
        default: ""
      head_ref:
        description: Candidate commit, branch or tag (also supplies the shared benchmark fixture)
        type: string
        default: main
      profile:
        description: Workload profile (diagnostic runs phase probes)
        type: choice
        options: [pr, extended, archive, diagnostic]
        default: pr
      cases:
        description: Comma-separated exact case names (blank runs the whole profile)
        type: string
        default: ""
      cpu_profile:
        description: Capture whole-child Node CPU profiles; timings become diagnostic only
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  compare:
    name: Compare scripted runtime
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.profile == 'pr' || inputs.profile == 'diagnostic') && 30 || 180 }}
    steps:
      - name: Resolve exact comparison commits
        id: comparison
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        with:
          script: |
            let baseRef = process.env.BASE_REF.trim();
            let baseTag = '';
            if (!baseRef) {
              // /releases/latest excludes prereleases. Use the umbrella package's
              // publication timestamp, not tag creation order or a sibling package.
              const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
              const latest = releases.filter(release => !release.draft && release.published_at &&
                /^(?:effect-agent|@yielded\/agent)@\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(release.tag_name))
                .sort((a, b) => b.published_at.localeCompare(a.published_at) || b.id - a.id)[0];
              if (!latest) throw new Error('No published @yielded/agent release found');
              baseRef = baseTag = latest.tag_name;
            }
            const headRef = process.env.HEAD_REF.trim() || 'main';
            const { data: base } = await github.rest.repos.getCommit({ ...context.repo, ref: baseRef });
            const { data: head } = await github.rest.repos.getCommit({ ...context.repo, ref: headRef });
            if (!/^[a-f0-9]{40}$/.test(base.sha) || !/^[a-f0-9]{40}$/.test(head.sha))
              throw new Error('Invalid comparison commit');
            core.setOutput('base_sha', base.sha);
            core.setOutput('base_tag', baseTag);
            core.setOutput('head_sha', head.sha);
            core.info(`Comparing ${base.sha} to ${head.sha}`);

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.comparison.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.comparison.outputs.base_sha }}
          path: .performance-base
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Bootstrap vp exactly as ordinary CI. Each checkout owns its lockfile;
      # installs and builds are sequential and finish before the first sample.
      - name: Install candidate dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install base dependencies
        working-directory: .performance-base
        run: ../node_modules/.bin/vp install --frozen-lockfile --ignore-scripts

      - name: Build candidate public packages
        run: |
          ./node_modules/.bin/vp run patch:tsgo
          ./node_modules/.bin/vp run --no-cache -F './packages/*' build

      - name: Build base public packages
        working-directory: .performance-base
        run: |
          ./node_modules/.bin/vp run patch:tsgo
          ./node_modules/.bin/vp run --no-cache -F './packages/*' build

      - name: Compare sequential cohorts
        timeout-minutes: ${{ (inputs.profile == 'pr' || inputs.profile == 'diagnostic') && 20 || 165 }}
        # The controller stops at 19m (bounded) / 160m (larger profiles), leaving time
        # for bounded child termination and atomic failure evidence before this outer limit.
        # Older releases do not ignore these known declaration artifacts emitted
        # by their package build. Remove only those generated scratch files.
        # The subsequent --require-clean check rejects every other modification.
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          BASE_TAG: ${{ steps.comparison.outputs.base_tag }}
          CASES: ${{ inputs.cases }}
          CPU_PROFILE: ${{ inputs.cpu_profile }}
        run: |
          rm -f .performance-base/test/fixtures/checkpoints.d.ts .performance-base/test/fixtures/storage-upgrade.d.ts .performance-base/test/fixtures/storage-v2.d.ts
          args=(--base-dir .performance-base --require-clean)
          if [ -n "$CASES" ]; then
            while IFS= read -r name; do
              name="${name#"${name%%[![:space:]]*}"}"
              name="${name%"${name##*[![:space:]]}"}"
              if [ -z "$name" ]; then printf '%s\n' 'Empty case selector' >&2; exit 1; fi
              args+=(--case "$name")
            done <<< "${CASES//,/$'\n'}"
          fi
          if [ "$CPU_PROFILE" = true ]; then args+=(--cpu-profile); fi
          if [ "$PROFILE" = diagnostic ]; then
            ./node_modules/.bin/vp run --no-cache perf:diagnose "${args[@]}"
          else
            if [ -n "$BASE_TAG" ]; then args+=(--base-tag "$BASE_TAG"); fi
            ./node_modules/.bin/vp run --no-cache perf:compare --profile "$PROFILE" "${args[@]}"
          fi

      - name: Preserve run identity and readable evidence
        if: always()
        env:
          BASE_TAG: ${{ steps.comparison.outputs.base_tag }}
          BASE_SHA: ${{ steps.comparison.outputs.base_sha }}
          HEAD_SHA: ${{ steps.comparison.outputs.head_sha }}
        run: |
          mkdir -p .performance-report
          printf 'Baseline: %s %s. Candidate: %s.\n\n' "$BASE_TAG" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          if test -f .performance-report/report.md; then cat .performance-report/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload all samples and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-performance
          path: .performance-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
