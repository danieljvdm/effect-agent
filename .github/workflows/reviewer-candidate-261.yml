name: Efficient reviewer candidate 261

# One authorized batch on a trusted owner branch. Removed after its one run.
on:
  push:
    branches: [dan/validate-reviewer-259]

permissions:
  contents: read

jobs:
  acceptance:
    if: github.actor == 'danieljvdm' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[review-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      VITE_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install pinned dependencies
        run: bunx --package vite-plus@0.2.6 vp install --frozen-lockfile --ignore-scripts
      - name: Verify the offline eval and shipping adapter
        run: |
          ./node_modules/.bin/vp run -F @effect-agent/example-pr-review-eval check
          ./node_modules/.bin/vp run -F @effect-agent/example-pr-review-eval test
          ./node_modules/.bin/vp run -F @effect-agent/pr-review-action test
      - name: Run one trial per frozen case
        env:
          EFFECT_AGENT_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./node_modules/.bin/vp run pr-review-candidate-261
      - name: Save observations and immutable source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: efficient-reviewer-candidate-1
          path: examples/pr-review-eval/results/efficient-261/candidate-1/
          if-no-files-found: error
          retention-days: 90
