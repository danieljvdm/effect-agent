name: Runtime performance comment

on:
  workflow_run:
    workflows: [Runtime performance]
    types: [completed]

permissions: {}

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-performance
          path: runtime-performance
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Trusted publisher: never check out candidate code, import its report
      # renderer, install its dependencies, or execute an artifact.
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const fs = require('node:fs');
            const read = (name, limit) => {
              const file = `runtime-performance/${name}`;
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > limit) throw new Error('Invalid performance artifact');
              return fs.readFileSync(file, 'utf8');
            };
            const report = JSON.parse(read('report.json', 3000000));
            if (report.fixture !== 'runtime-v3' || report.profile !== 'pr' ||
                !/^effect-agent@\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(report.baselineTag) ||
                report.activeBatch !== null || report.failure !== null ||
                report.settings?.batches !== 3 || report.settings?.warmupsPerBatch !== 2 || report.settings?.samplesPerBatch !== 3 ||
                report.settings?.production !== true || report.settings?.execution !== 'unbundled published ESM' || report.settings?.timingGate !== 'informational' ||
                report.environment?.node !== 'v24.20.0' ||
                !/^[a-f0-9]{64}$/.test(report.fixtureSha256) ||
                !Array.isArray(report.revisions) || report.revisions.length !== 2 ||
                !Array.isArray(report.batches) || report.batches.length !== 12) {
              throw new Error('Invalid report contract');
            }
            const revision = role => report.revisions.find(value => value.role === role);
            for (const role of ['base', 'head']) {
              if (!/^[a-f0-9]{40}$/.test(revision(role)?.revision) || revision(role).dirty !== false ||
                  !/^[a-f0-9]{64}$/.test(revision(role).lockfileSha256) ||
                  !/^[a-f0-9]{64}$/.test(revision(role).builtArtifactsSha256)) throw new Error('Invalid revision');
            }
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (run.event !== 'push' || run.head_branch !== 'main' || run.head_repository.full_name !== repository ||
                run.head_sha !== revision('head').revision || main.object.sha !== revision('head').revision) return;
            // Re-resolve release identity using trusted API data. A newer release
            // or moved tag makes the completed comparison stale.
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const latest = releases.filter(release => !release.draft && release.published_at &&
              /^effect-agent@\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(release.tag_name))
              .sort((a, b) => b.published_at.localeCompare(a.published_at) || b.id - a.id)[0];
            if (!latest || latest.tag_name !== report.baselineTag) return;
            const { data: tag } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${latest.tag_name}` });
            let object = tag.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              const { data } = await github.rest.git.getTag({ ...context.repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== revision('base').revision) return;
            const identical = revision('base').builtArtifactsSha256 === revision('head').builtArtifactsSha256 &&
              revision('base').lockfileSha256 === revision('head').lockfileSha256;
            const summarize = values => {
              values.sort((a, b) => a - b);
              const quantile = p => {
                const i = (values.length - 1) * p, lower = Math.floor(i);
                return values[lower] + (values[Math.ceil(i)] - values[lower]) * (i - lower);
              };
              return { median: quantile(0.5), q1: quantile(0.25), q3: quantile(0.75) };
            };
            const expected = ['small-run', 'small-stream', ...[1,64,1024,4096].map(n => `stream-64k-${n}`),
              'history-65536', 'history-1048576', 'parallel-tools-8', 'tool-rounds-4',
              ...[0,256,2048].flatMap(n => [`durable-fresh-${n}`, `checkpoint-recovery-${n}`, `settled-ledger-${n}`])];
            const samples = [];
            const identities = new Set();
            for (const batch of report.batches) {
              const key = `${batch.role}:${batch.cohort}:${batch.cold}`;
              if (!['base','head'].includes(batch.role) || ![0,1,2].includes(batch.cohort) ||
                  typeof batch.cold !== 'boolean' || identities.has(key) || batch.exitCode !== 0 || batch.complete !== true ||
                  batch.failure !== null || !Number.isFinite(batch.subprocessMs) || batch.subprocessMs < 0 ||
                  batch.report?.fixture !== report.fixture || batch.report?.profile !== report.profile ||
                  batch.report?.runtime !== report.environment.node || batch.report?.platform !== report.environment.platform ||
                  batch.report?.architecture !== report.environment.architecture || batch.report?.active !== null || batch.report?.failure !== null ||
                  !Array.isArray(batch.report?.samples)) throw new Error('Invalid cohort');
              identities.add(key);
              const workloads = batch.cold ? ['small-run'] : expected;
              const ordinals = batch.cold ? [0] : [0,1,2,3,4];
              if (batch.report.samples.length !== workloads.length * ordinals.length) throw new Error('Incomplete cohort');
              const unique = new Set();
              for (const sample of batch.report.samples) {
                const id = `${sample.case}:${sample.ordinal}`;
                if (!workloads.includes(sample.case) || !ordinals.includes(sample.ordinal) || unique.has(id) ||
                    sample.status !== 'passed' || sample.failure !== null || sample.failurePhase !== null ||
                    sample.warmup !== (!batch.cold && sample.ordinal < 2) ||
                    !Number.isFinite(sample.totalMs) || sample.totalMs < 0 || sample.totalMs > 180000 ||
                    !Number.isFinite(sample.attemptMs) || !Number.isFinite(sample.setupMs) || sample.setupMs < 0 ||
                    sample.attemptMs < sample.setupMs + sample.totalMs ||
                    !Number.isFinite(sample.modelEntryMs) || sample.modelEntryMs < 0 || sample.modelEntryMs > sample.totalMs ||
                    !Number.isInteger(sample.modelCalls) || sample.modelCalls < 1 || sample.modelCalls !== sample.finalizers) throw new Error('Invalid sample');
                unique.add(id);
                if (!batch.cold && !sample.warmup) samples.push({ role: batch.role, name: sample.case, ms: sample.totalMs });
              }
            }
            const rows = expected.map(name => {
              const values = role => samples.filter(s => s.name === name && s.role === role).map(s => s.ms);
              const base = summarize(values('base')), head = summarize(values('head'));
              const format = value => `${value.median.toFixed(2)} [${value.q1.toFixed(2)}–${value.q3.toFixed(2)}]`;
              return `| ${name} | ${format(base)} | ${format(head)} |`;
            });
            const marker = '<!-- effect-agent:runtime-performance -->';
            const repoUrl = `https://github.com/${repository}`;
            const body = `${marker}\n### Runtime timing diagnostics: latest release → main\n\n` +
              `**Informational timings.** [Deterministic performance gates](${repoUrl}/blob/${revision('head').revision}/docs/TOOLCHAIN.md#deterministic-performance-checks) run in ordinary CI and bound algorithmic work. This timing run does not establish a latency regression or a merge threshold.\n\n` +
              `Release: [\`${report.baselineTag}\`](${repoUrl}/releases/tag/${encodeURIComponent(report.baselineTag)}) (\`${revision('base').revision.slice(0,12)}\`). ` +
              `Main: [\`${revision('head').revision.slice(0,12)}\`](${repoUrl}/commit/${revision('head').revision}).\n\n` +
              '<details>\n<summary>Observed operation timings</summary>\n\n' +
              'Operation median [Q1–Q3] in milliseconds; nine samples per workload and revision across three worker processes. Same fixture bytes and Node runtime; separate lockfiles and public builds.\n\n' +
              (identical ? '**Identical built JavaScript and lockfiles. Timing differences do not establish a code regression.**\n\n' : '') +
              '| Workload | Latest release | Main |\n| --- | ---: | ---: |\n' + rows.join('\n') +
              '\n\n</details>\n\n' +
              `[Full timing report, raw samples, cold process totals, failures, environment, and exact revisions](${run.html_url}). ` +
              'Shared-runner wall-clock measurements vary. Sample spread is not a confidence interval; percentage deltas remain in the diagnostic artifact rather than this automatic comment.';
            const pulls = await github.paginate(github.rest.pulls.list, {
              ...context.repo, state: 'open', base: 'main', head: `${context.repo.owner}:changeset-release/main`, per_page: 100,
            });
            const pr = pulls.find(pr => pr.state === 'open' && pr.head.ref === 'changeset-release/main' &&
              pr.head.repo?.full_name === repository && pr.base.ref === 'main' &&
              pr.base.repo.full_name === repository && pr.base.sha === revision('head').revision);
            if (!pr) return;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number, per_page: 100 });
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
