name: Deploy travel planner

on:
  push:
    branches: [main]
    paths:
      - "examples/travel-planner/**"
      - ".github/workflows/deploy-travel-planner.yml"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "bunfig.toml"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-travel-planner-production
  cancel-in-progress: false

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  deploy:
    # Manual dispatch deploys the selected ref for explicitly authorized hosted checks.
    # Automatic deployments remain limited to main after the initial cutover.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.TRAVEL_PLANNER_DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: "0.3.0"
          node-version: "24"
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Check application
        run: vp run -F @effect-agent/example-travel-planner check

      - name: Test application
        working-directory: examples/travel-planner
        run: vp test

      - name: Deploy with Alchemy
        env:
          # Same account and remote Alchemy state credentials as Deploy docs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_ORIGIN: https://travel.effect-agent.com
          AUTH_EMAIL_FROM: auth@effect-agent.com
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.TRAVEL_PLANNER_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.TRAVEL_PLANNER_GITHUB_CLIENT_SECRET }}
          AUTH_BINDING_KEY: ${{ secrets.TRAVEL_PLANNER_AUTH_BINDING_KEY }}
          AUTH_PROOF_KEY: ${{ secrets.TRAVEL_PLANNER_AUTH_PROOF_KEY }}
          AUTH_TRANSACTION_KEY: ${{ secrets.TRAVEL_PLANNER_AUTH_TRANSACTION_KEY }}
          BYOK_ENCRYPTION_KEY: ${{ secrets.TRAVEL_PLANNER_BYOK_ENCRYPTION_KEY }}
          SERVER_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AUTH_GITHUB_CLIENT_ID AUTH_GITHUB_CLIENT_SECRET AUTH_BINDING_KEY AUTH_PROOF_KEY AUTH_TRANSACTION_KEY BYOK_ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment configuration: $name"
              exit 1
            fi
          done
          vp run -F @effect-agent/example-travel-planner deploy --yes

      - name: Enable traces with query-string redaction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Alchemy's SDK omits redact_query_string. Verify Cloudflare accepts it
          # while tracing is disabled before enabling collection.
          settings_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/effect-agent-travel-planner/script-settings"
          for tracing in false true; do
            jq -n --argjson tracing "$tracing" '{observability: {
              enabled: true,
              redact_query_string: true,
              logs: {enabled: true, invocation_logs: false},
              traces: {enabled: $tracing, persist: true, head_sampling_rate: 1}
            }}' > "$RUNNER_TEMP/planner-observability.json"
            curl --fail --silent --show-error --max-time 30 \
              --request PATCH "$settings_url" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/planner-observability.json" \
              | jq -e '.success == true'
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$settings_url" \
              | jq -e --argjson tracing "$tracing" '
                .success == true and
                .result.observability.redact_query_string == true and
                .result.observability.logs.invocation_logs == false and
                .result.observability.traces.enabled == $tracing and
                .result.observability.traces.persist == true'
          done
