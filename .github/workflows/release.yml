name: Release

on:
  workflow_dispatch:
    inputs:
      force_beta152:
        description: Publish beta.152 with the explicitly authorized QA bypass
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  release:
    name: Publish authorized beta.152 release
    if: ${{ inputs.force_beta152 && github.ref == 'refs/heads/dan/force-beta152-release' }}
    concurrency:
      group: release-workflow_run
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Record authorized QA override
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Dan explicitly authorized forcing the changeset release without QA checks because they are currently flaky.
          Release: beta.152, changeset PR #699, including the merged recovery fix #700.
          Exact source: 57acf8440c3fa8293d3382bb9b9488c78e81b86d.
          This one-off invocation builds the release and publishes without the live continuity and hosted checkout gates.
          The ordinary main-branch CI and release workflows remain unchanged.
          EOF

      - name: Check out the exact merged release revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 57acf8440c3fa8293d3382bb9b9488c78e81b86d
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5
        with:
          version: "0.3.3"
          node-version: "24"
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go
        run: vp run patch:tsgo

      - name: Upgrade npm for trusted publishing
        run: vp exec npm install --global npm@12.0.2

      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Build and publish with the authorized QA override
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: ./node_modules/.bin/vp run --no-cache release:publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
