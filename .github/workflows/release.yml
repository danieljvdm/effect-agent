name: Release

on:
  # Generate the version PR only after the exact main revision has finished CI.
  # This event waits without reserving a runner; the PR proof still fails closed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    # workflow_run has write authority: accept only this repo's successful main
    # push. Changesets uses github.sha internally, so it MUST equal the tested
    # head (workflow_run's default-branch SHA can otherwise have moved ahead).
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
      actions: read
      pull-requests: write
      id-token: write
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go
        run: ./node_modules/.bin/vp run patch:tsgo

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@12.0.2

      # App-authored updates trigger ordinary PR CI, unlike GITHUB_TOKEN pushes.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: ./node_modules/.bin/vp run --no-cache ci:version
          publish: ./node_modules/.bin/vp run --no-cache release:checked-publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BUILD_RUN: ${{ github.event.workflow_run.id }}
          RELEASE_BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RELEASE_BUILD_TOKEN: ${{ github.token }}
          EFFECT_AGENT_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXT_EVAL_MODEL: ${{ vars.CONTEXT_EVAL_MODEL || 'gpt-6-astra' }}

      - name: Preserve continuity gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: context-continuity-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context-continuity-eval/run/
          if-no-files-found: ignore
          retention-days: 30
