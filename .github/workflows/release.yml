name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Patch Effect TypeScript-Go
        run: ./node_modules/.bin/vp run patch:tsgo

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@12.0.2

      # App-authored updates trigger ordinary PR CI, unlike GITHUB_TOKEN pushes.
      - name: Mint the release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create release pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: ./node_modules/.bin/vp run --no-cache ci:version
          publish: ./node_modules/.bin/vp run release:publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
