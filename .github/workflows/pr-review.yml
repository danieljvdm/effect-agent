# Agentic pull-request review via the prebuilt ./action bundle
# (@effect-agent/pr-review). The job runs only when the OPENAI_API_KEY secret
# is configured (the secrets context is unavailable in `if:` conditions, so
# presence is carried through a job-level env var). Reviews always post as
# COMMENT events.
name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Check out repository
        if: env.HAS_OPENAI_KEY == 'true'
        uses: actions/checkout@v4

      - name: Review the pull request and post the validated result
        if: env.HAS_OPENAI_KEY == 'true'
        uses: ./action
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Dogfood the subagent fan-out variant (S1 attached delegation).
          fan-out: "true"
