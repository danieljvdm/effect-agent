# Agentic pull-request review via the prebuilt ./action bundle
# (@effect-agent/pr-review). The job runs only when the OPENAI_API_KEY secret
# is configured (the secrets context is unavailable in `if:` conditions, so
# presence is carried through a job-level env var). Reviews always post as
# COMMENT events.
name: PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - if: env.HAS_OPENAI_KEY == 'true'
        uses: actions/checkout@v4

      - if: env.HAS_OPENAI_KEY == 'true'
        uses: ./action
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Dogfood the subagent fan-out variant (S1 attached delegation).
          fan-out: "true"
          # This repository's non-negotiables (AGENTS.md), distilled for the
          # reviewer. Fan-out injects these lines into every child reviewer.
          guidance: |
            This is the effect-agent framework repository: Effect v4, schema-first, fail-closed.
            Flag as important: public asynchronous operations returning naked Promises instead of Effect or Stream; expected failures widened to unknown/Error/any; type assertions crossing a Schema boundary; decoding untrusted values by assertion instead of Schema.
            Flag as blocking: any code or wording claiming exactly-once external side-effect execution, or calling something "durable" without naming the DN or DC assembly; an inward package importing an outward one (dependency direction: core <- engine <- capabilities; core <- engine <- session <- storage adapters; platform packages outermost); trusting model-supplied paths, ids, or ranges without fail-closed validation.
            Do not flag style already enforced by the toolchain (formatting, import order, lint-level nits).
          # Generated and vendored surfaces the reviewer should never spend
          # budget on: the lockfiles, the committed action bundle, changesets
          # output, and dev-kit-managed skill copies.
          ignore: "bun.lock,dev-kit.lock.json,action/dist/**,**/CHANGELOG.md,.agents/skills/**,.claude/skills/**"
          max-findings: "12"
