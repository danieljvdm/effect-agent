name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      VITE_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run ready
