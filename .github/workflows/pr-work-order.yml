# Admit an explicit mention reply on one inline review comment as a work
# order and post a host-authored thread reply. Isolation evidence exists;
# this first live entrypoint does not run a model or publish commits.
# The publisher write token is not present. The read-only reviewer Action is unused.
name: PR work order

on:
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-work-order-${{ github.event.pull_request.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Admit work-order dispatch
    if: ${{ github.event.comment.body == '@effect-agent fix this' && github.event.comment.in_reply_to_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Admit the work order and reply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECT_AGENT_AUTHORIZED_ACTOR_IDS: "3450486"
        run: bun examples/pr-work-order-ingress/src/bin.ts
