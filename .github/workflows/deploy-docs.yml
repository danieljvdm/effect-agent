# Deploys the VitePress docs site to a Cloudflare Worker with Alchemy
# (alchemy.run.ts, stage `prod`, https://effect-agent.danvdm.com). Alchemy
# runs `bun run docs:build` itself, content-hashes the output, and skips the
# deploy when nothing changed; state lives in the account-wide Cloudflare
# state store, whose credentials the CI run resolves from the account's
# Secrets Store via CLOUDFLARE_API_TOKEN.
name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "alchemy.run.ts"
      - ".github/workflows/deploy-docs.yml"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  CI: "true"
  VITE_GIT_HOOKS: "0"

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs (not mutable tags): this job hands the deploy
      # step Cloudflare credentials, so the actions that run before it must
      # be immutable, reviewed code.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies (frozen, scripts suppressed)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Deploy with Alchemy
        run: bun alchemy deploy --stage prod --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
