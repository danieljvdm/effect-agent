# Deploys the VitePress docs site to a Cloudflare Worker with Alchemy
# (alchemy.run.ts, stage `prod`, https://effect-agent.com). Alchemy
# runs `vp run docs:build` itself, content-hashes the output, and skips the
# deploy when nothing changed; state lives in the account-wide Cloudflare
# state store, whose credentials the CI run resolves from the account's
# Secrets Store via CLOUDFLARE_API_TOKEN.
name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "alchemy.run.ts"
      - ".github/workflows/deploy-docs.yml"
      - "bun.lock"
      - "package.json"
      - "vite.config.ts"
      - "bunfig.toml"
      - "patches/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs (not mutable tags): this job hands the deploy
      # step Cloudflare credentials, so the actions that run before it must
      # be immutable, reviewed code.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          version: "0.3.0"
          node-version: "24"
          run-install: false
          cache: true

      - name: Install dependencies (frozen, scripts suppressed)
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Deploy with Alchemy
        run: vp run docs:deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
