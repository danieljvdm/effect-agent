# Formal model checking (TLA+/TLC). Deliberately NOT part of the PR gate or
# `bun run ready`: it needs a JVM the Bun-only CI does not carry, and the
# large safety instance takes minutes. Runs weekly and on demand.
name: Formal

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (TLC model checker)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      # Runs SANY + TLC on every committed bounded instance and asserts each
      # verdict, including that the negative controls FAIL (formal/README.md).
      - name: Check the TLA+ models with SANY and TLC
        run: bun run formal:check
