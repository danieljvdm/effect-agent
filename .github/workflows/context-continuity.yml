name: Context continuity

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: One bounded profile (not a matrix)
        type: choice
        default: explicit-rollover-sqlite-v1
        options: [explicit-rollover-sqlite-v1, pressure-restart-sqlite-v1]
      model:
        description: Model to evaluate
        type: choice
        default: gpt-6-astra
        options: [gpt-6-astra, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.4-mini]

permissions:
  contents: read

concurrency:
  group: context-continuity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      VP_GIT_HOOKS: "0"
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run the live continuity gate
        run: ./node_modules/.bin/vp run --no-cache context-continuity-eval --require-clean --profile "$CONTEXT_EVAL_PROFILE" --max-cost-usd 10
        env:
          CONTEXT_EVAL_PROFILE: ${{ inputs.profile || 'explicit-rollover-sqlite-v1' }}
          EFFECT_AGENT_LIVE: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTEXT_EVAL_MODEL: ${{ inputs.model || vars.CONTEXT_EVAL_MODEL || 'gpt-6-astra' }}
      - name: Preserve this attempt's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: context-continuity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .context-continuity-eval/run/
          if-no-files-found: warn
          retention-days: 30
